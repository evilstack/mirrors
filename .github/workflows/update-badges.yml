name: Update Mirror Badges

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run status updater script
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 'b24a1fa2b005e5fce6fb11e1c6712559'
        run: python3 .github/update_badges.py
